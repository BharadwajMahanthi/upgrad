{% extends "base.html" %}

{% block title %}Join NutriGo AI Experience{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade">
    <div class="col-md-9 col-lg-7">
        <div class="glass-card p-5 bg-white border-0 shadow-lg">
            <div class="text-center mb-5">
                <div class="p-4 bg-primary bg-opacity-10 d-inline-block rounded-circle mb-3">
                    <i class="fas fa-user-plus fa-3x text-primary"></i>
                </div>
                <h2 class="fw-bold text-dark">Build Bio-Profile</h2>
                <p class="text-muted">Personalize your AI engine for optimal results.</p>
            </div>
            
            <form method="post">
                <div class="row g-4 mb-4">
                    <div class="col-md-7">
                        <label for="user_id" class="form-label text-muted small fw-bold uppercase">Public Identity</label>
                        <input type="text" class="form-control p-3 shadow-none border-light" name="user_id" id="user_id" placeholder="Choose a User ID" required>
                    </div>
                    <div class="col-md-5">
                        <label for="age" class="form-label text-muted small fw-bold uppercase">Age</label>
                        <input type="number" class="form-control p-3 shadow-none border-light" name="age" id="age" placeholder="Years">
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="weight" class="form-label text-muted small fw-bold uppercase">Weight (kg)</label>
                        <input type="number" class="form-control p-3 shadow-none border-light" name="weight" id="weight" step="0.1">
                    </div>
                    <div class="col-md-6">
                        <label for="height" class="form-label text-muted small fw-bold uppercase">Height (cm)</label>
                        <input type="number" class="form-control p-3 shadow-none border-light" name="height" id="height" step="0.1">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="goal" class="form-label text-muted small fw-bold uppercase">Primary Goal</label>
                    <select class="form-select p-3 shadow-none border-light" name="goal" id="goal">
                        <option value="maintenance">General Wellness</option>
                        <option value="diet">Weight Mitigation (Diet)</option>
                        <option value="muscle growth">Muscle Hypertrophy</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="health_details" class="form-label text-muted small fw-bold uppercase">Medical/Vital Context</label>
                    <textarea class="form-control p-3 shadow-none border-light" name="health_details" id="health_details" rows="3" placeholder="Allergies, conditions..."></textarea>
                </div>

                <div class="mb-5">
                    <label for="preferences" class="form-label text-muted small fw-bold uppercase">Dietary Directives</label>
                    <textarea class="form-control p-3 shadow-none border-light" name="preferences" id="preferences" rows="3" placeholder="e.g. Keto, Vegan, Gluten-Free"></textarea>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 shadow-none">
                    Initialize Profile
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
