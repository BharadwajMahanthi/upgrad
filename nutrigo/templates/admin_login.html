{% extends "base.html" %}

{% block title %}Admin Portal - NutriGo AI{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade">
    <div class="col-md-5">
        <div class="glass-card p-5 mt-5 bg-white border-0 shadow-lg">
            <div class="text-center mb-5">
                <div class="p-3 bg-emerald-light d-inline-block rounded-circle mb-3">
                    <i class="fas fa-shield-halved fa-3x text-primary"></i>
                </div>
                <h2 class="fw-bold text-dark">Environment Admin</h2>
                <p class="text-muted small">Standard protocol for system access.</p>
            </div>

            <form method="post">
                <div class="mb-4">
                    <label for="username" class="form-label text-muted small uppercase fw-bold">Admin ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-light text-muted"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control p-3 border-light shadow-none" id="username" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="mb-5">
                    <label for="password" class="form-label text-muted small uppercase fw-bold">Security Key</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-light text-muted"><i class="fas fa-key"></i></span>
                        <input type="password" name="password" class="form-control p-3 border-light shadow-none" id="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 shadow-none">
                    Authenticate & Initialize
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    .bg-emerald-light { background-color: rgba(16, 185, 129, 0.1); }
</style>
{% endblock %}
